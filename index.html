:root{--bg:#eef2f7;--card:#fff;--ink:#162033;--muted:#667085;--blue:#3156d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif;overscroll-behavior:none}.app{max-width:1200px;margin:auto;padding:10px}h1{margin:4px 0 10px;font-size:clamp(20px,3vw,30px)}h1 small{font-size:.45em;color:var(--muted)}.bar{display:flex;gap:7px;align-items:end;flex-wrap:wrap;background:var(--card);padding:9px;border:1px solid #d7deea;border-radius:13px;margin-bottom:8px}.g{display:grid;gap:3px}.g label{font-size:11px;font-weight:750;color:var(--muted)}button,select,input,.file{min-height:39px;border:1px solid #b8c1d0;border-radius:8px;background:#fff;padding:7px 10px;font:inherit;font-weight:650}.file{cursor:pointer}.file input{display:none}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled,select:disabled{opacity:.45}.check{display:flex;align-items:center;gap:5px;min-height:39px;padding:0 5px}.check input{width:18px;height:18px}.stage{height:clamp(240px,44vh,480px);position:relative;overflow:hidden;background:linear-gradient(#101a31,#182c53);border-radius:13px 13px 0 0}.lanes{height:100%;display:grid;grid-template-columns:repeat(13,1fr)}.lane{position:relative;border-right:1px solid #ffffff18}.hit{position:absolute;bottom:5px;left:0;right:0;height:5px;background:#fff9;box-shadow:0 0 15px #fff;z-index:5}.fog{position:absolute;left:0;right:0;bottom:0;height:82px;z-index:4;pointer-events:none;overflow:hidden;mix-blend-mode:screen}.fog:before,.fog:after{content:"";position:absolute;inset:20px -8% -30px;background:radial-gradient(ellipse at 20% 70%,#fff5,transparent 27%),radial-gradient(ellipse at 50% 80%,#b8d8ff55,transparent 31%),radial-gradient(ellipse at 82% 65%,#fff4,transparent 26%);filter:blur(12px);opacity:.55;animation:fogmove 7s ease-in-out infinite alternate}.fog:after{transform:scaleX(-1);opacity:.35;animation-duration:10s}.fog.off{display:none}.fog.reduced:before,.fog.reduced:after{an </style></head><body><div class="app"><h1>Xilófono Synthesia <small>v06</small></h1>

<script>(()=>{'use strict';const $=x=>document.getElementById(x),MN=[60,62,64,65,67,69,71,72,74,76,77,79,81],NM=['Do','Re','Mi','Fa','Sol','La','Si','Do↑','Re↑','Mi↑','Fa↑','Sol↑','La↑'],CL=['#e74c3c','#f08434','#f2c94c','#93c94b','#32b56b','#22b7a9','#23a7d7','#3987df','#596bd8','#8659d4','#b14fbe','#df4d9c','#ef6074'];const demo=[60,60,67,67,69,69,67,65,65,64,64,62,62,60],makeDemo=()=>demo.map((p,i)=>({pitch:p,start:i*.55,dur:.42}));let song=makeDemo(),duration=8,parts=[],tempos=[{tick:0,tempo:500000}],division=480,all=[],offset=0,playing=false,paused=false,startAt=0,pauseAt=0,speed=1,raf,audio,els=[],scheduled=new Set(),hold=false,demoMode=true,stats={score:0,h:0,a:0,st:0};
MN.forEach((n,i)=>{let l=document.createElement('div');l.className='lane';$('lanes').append(l);let k=document.createElement('button');k.className='key';k.type='button';k.style.background=CL[i];k.style.height=(100-i*2.35)+'%';k.textContent=NM[i];$('keys').append(k);k.onpointerdown=e=>{e.preventDefault();strike(i);k.classList.add('on')};k.onpointerup=k.onpointercancel=()=>k.classList.remove('on')});
function ctx(){if(!audio)audio=new (AudioContext||webkitAudioContext)();audio.resume();return audio}function tone(note,vol=.45,dur=.75,when=0,type='sine'){let a=ctx(),t=Math.max(a.currentTime,when),g=a.createGain();g.connect(a.destination);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);let o=a.createOscillator();o.type=type;o.frequency.value=440*2**((note-69)/12);o.connect(g);o.start(t);o.stop(t+dur)}function noise(when,dur,vol,highpass=0){let a=ctx(),t=Math.max(a.currentTime,when),buf=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate),x=buf.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;let src=a.createBufferSource(),g=a.createGain();src.buffer=buf;if(highpass){let f=a.createBiquadFilter();f.type='highpass';f.frequency.value=highpass;src.connect(f).connect(g)}else src.connect(g);g.connect(a.destination);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.start(t);src.stop(t+dur)}function drum(note,when=0){let a=ctx(),t=Math.max(a.currentTime,when);if(note===35||note===36){let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(48,t+.16);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.3)}else if([38,39,40].includes(note)){noise(t,.18,.18,900);tone(50,.12,.16,t,'triangle')}else if([42,44,46].includes(note)){noise(t,note===46?.28:.09,.095,5000)}else if(note>=41&&note<=50){tone(42+(50-note)*3,.18,.24,t,'sine')}else if([49,51,52,55,57,59].includes(note)){noise(t,.6,.10,3000)}else{noise(t,.12,.07,1800)}}function tick(){tone(96,.08,.04,0,'square')}
function now(){return paused?pauseAt:(performance.now()/1000-startAt)*speed}function update(){score.textContent=stats.score;hits.textContent=stats.h+'/'+stats.a;streak.textContent=stats.st;accuracy.textContent=stats.a?Math.round(stats.h/stats.a*100)+'%':'—'}function wrong(t){stats.a++;stats.st=0;$('msg').className='msg bad';$('msg').textContent=t;update()}
function burst(i,good=true){if($('fx').value==='off')return;let b=document.createElement('div');b.className='burst';b.style.left=((i+.5)/13*100)+'%';b.style.background=good?`radial-gradient(circle,#fff 0%,${CL[i]} 28%,transparent 70%)`:'radial-gradient(circle,#fff 0%,#e53935 30%,transparent 70%)';$('stage').append(b);setTimeout(()=>b.remove(),520)}function strike(i){tone(MN[i]);if($('mode').value==='free'||!playing)return;let t=now(),c=song.filter(n=>!n.hit&&!n.miss&&n.pitch===MN[i]);if(!c.length)return wrong('Nota incorrecta');let n=c.reduce((a,b)=>Math.abs(a.start-t)<Math.abs(b.start-t)?a:b),e=t-n.start,ok=$('mode').value==='learn'||Math.abs(e)<=+$('tol').value;if(!ok)return wrong(e<0?'Demasiado pronto':'Demasiado tarde');n.hit=true;stats.h++;stats.a++;stats.st++;stats.score+=($('mode').value==='learn'||Math.abs(e)<.12)?100:Math.abs(e)<.27?70:40;$('msg').className='msg ok';$('msg').textContent=$('mode').value==='learn'?'Correcto. Continúa.':'¡Bien!';burst(i,true);if(hold){hold=false;startAt=performance.now()/1000-t/speed}update()}
function build(){els.forEach(e=>e.remove());els=song.map(n=>{let i=MN.indexOf(n.pitch);if(i<0)return null;let e=document.createElement('div');e.className='fall';e.style.background=CL[i];$('lanes').children[i].append(e);return e})}function reset(show=true){cancelAnimationFrame(raf);playing=paused=hold=false;scheduled.clear();$('play').disabled=false;$('pause').disabled=true;$('pause').textContent='⏸ Pausa';stats={score:0,h:0,a:0,st:0};song.forEach(n=>{n.hit=n.miss=false});update();build();els.forEach(e=>e.style.opacity=0);if(show)$('msg').textContent='Reiniciado.'}
function sec(t){let s=0,p=0,tm=500000;for(let e of tempos){if(e.tick>t)break;s+=(e.tick-p)*tm/1e6/division;p=e.tick;tm=e.tempo}return s+(t-p)*tm/1e6/division}function accompany(t){if(!$('accomp').checked||demoMode)return;all.forEach((n,i)=>{if(n.part===+$('voice').value||scheduled.has(i))return;let st=sec(n.s)-offset;if(st>=t&&st<t+.25){scheduled.add(i);let when=ctx().currentTime+(st-t)/speed;if(n.ch===9)drum(n.p,when);else tone(n.p,.065,Math.min(1,Math.max(.1,sec(n.e)-sec(n.s))),when,'triangle')}})}
function frame(){if(!playing)return;let t=now(),a=Math.max(0,+$('ls').value||0),b=+$('le').value||duration;if(b<=a)b=duration;if($('loop').checked&&t>b){startAt=performance.now()/1000-a/speed;t=a;scheduled.clear();song.forEach(n=>{if(n.start>=a&&n.start<=b)n.hit=n.miss=false})}let travel=+$('ahead').value,H=$('stage').clientHeight,want=-1,next=null;song.forEach((n,j)=>{let e=els[j];if(!e)return;let y=H-8-(n.start-t)/travel*H,h=Math.max(12,n.dur/travel*H);e.style.height=h+'px';e.style.transform=`translateY(${y-h}px)`;e.style.opacity=(y<-h||y>H+h)?0:1;if(!n.hit&&!n.miss&&n.start-t<.18&&n.start-t>-.5){want=MN.indexOf(n.pitch);if(!next||n.start<next.start)next=n}if($('mode').value==='rhythm'&&!n.hit&&!n.miss&&t-n.start>+$('tol').value){n.miss=true;stats.a++;stats.st=0;update()}});if($('mode').value==='learn'&&next&&t>=next.start&&!next.hit){if(!hold){pauseAt=next.start;hold=true}startAt=performance.now()/1000-pauseAt/speed;t=pauseAt}[...$('keys').children].forEach((k,i)=>k.classList.toggle('want',i===want));let fx=$('fx').value;[...document.querySelectorAll('.glow')].forEach((g,i)=>{let near=song.filter(n=>!n.hit&&!n.miss&&MN.indexOf(n.pitch)===i&&n.start-t>=-.12&&n.start-t<=.65).sort((a,b)=>a.start-b.start)[0],power=near?Math.max(0,1-(near.start-t)/.65):0;g.style.opacity=fx==='off'?0:(fx==='epic'?.9:.48)*power;g.style.transform=`scaleY(${.7+power*.55})`});accompany(t);if($('metro').checked&&Math.floor(t/.55)!==frame.beat){frame.beat=Math.floor(t/.55);tick()}if(t>duration+.5){playing=false;$('play').disabled=false;$('pause').disabled=true;$('msg').className='msg ok';$('msg').textContent=`Final: ${stats.h} aciertos de ${stats.a}.`;return}raf=requestAnimationFrame(frame)}
async function play(){ctx();if(paused){paused=false;playing=true;startAt=performance.now()/1000-pauseAt/speed;$('play').disabled=true;$('pause').disabled=false;frame();return}reset(false);for(let i=3;i;i--){$('count').textContent=i;tick();await new Promise(r=>setTimeout(r,600))}$('count').textContent='¡YA!';await new Promise(r=>setTimeout(r,350));$('count').textContent='';playing=true;startAt=performance.now()/1000;$('play').disabled=true;$('pause').disabled=false;frame()}
$('play').onclick=play;$('pause').onclick=()=>{if(!playing)return;pauseAt=now();playing=false;paused=true;cancelAnimationFrame(raf);$('play').disabled=false;$('pause').textContent='▶ Seguir'};$('reset').onclick=()=>reset();$('speed').oninput=e=>{let t=playing?now():0;speed=+e.target.value/100;$('sv').textContent=e.target.value+'%';if(playing)startAt=performance.now()/1000-t/speed};$('mode').onchange=()=>reset();$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.querySelector('.app').requestFullscreen?.();function setFx(){let f=$('fog');f.classList.toggle('off',$('fx').value==='off');f.classList.toggle('reduced',$('reduced').checked);if($('reduced').checked)document.querySelectorAll('.burst').forEach(b=>b.remove())}$('fx').onchange=setFx;$('reduced').onchange=setFx;setFx();
function rv(d,p){let v=0,b;do{b=d.getUint8(p.i++);v=v<<7|b&127}while(b&128);return v}function label(p){return `${p.name||'Pista '+(p.tr+1)} · canal ${p.ch+1} · ${p.n.length} notas`}function bestShift(ns){let z={s:0,c:-1};for(let s of [-36,-24,-12,0,12,24,36]){let c=ns.filter(n=>MN.includes(n.p+s)).length;if(c>z.c)z={s,c}}return z.s}function choose(i,announce=true){demoMode=false;let p=parts[i],sh=$('oct').value==='auto'?bestShift(p.n):+$('oct').value,u=p.n.map(n=>({...n,p:n.p+sh})).filter(n=>MN.includes(n.p));if(!u.length){$('msg').className='msg bad';$('msg').textContent='Esta voz no tiene notas utilizables en el xilófono.';return}offset=sec(u[0].s);song=u.map(n=>({pitch:n.p,start:sec(n.s)-offset,dur:Math.max(.08,sec(n.e)-sec(n.s))}));duration=Math.max(...song.map(n=>n.start+n.dur));$('le').value=Math.ceil(duration*2)/2;reset(false);if(announce)$('msg').textContent=`Solo se muestran y evalúan ${song.length} notas de «${label(p)}».`}
function chooseDemo(announce=true){demoMode=true;song=makeDemo();duration=song.at(-1).start+1;offset=0;$('le').value=Math.ceil(duration*2)/2;reset(false);if(announce){$('msg').className='msg ok';$('msg').textContent='Ejemplo seleccionado: Estrellita, ¿dónde estás? No utiliza acompañamiento MIDI.'}}function fillVoiceSelector(selected='demo'){let sel=$('voice');sel.innerHTML='';let d=document.createElement('option');d.value='demo';d.textContent='Ejemplo · Estrellita, ¿dónde estás?';sel.append(d);parts.forEach((p,i)=>{if(p.ch===9)return;let o=document.createElement('option');o.value=String(i);o.textContent=label(p);sel.append(o)});sel.disabled=false;sel.value=selected}fillVoiceSelector();$('voice').onchange=e=>{if(e.target.value==='demo')chooseDemo();else{demoMode=false;choose(+e.target.value)}};$('oct').onchange=()=>{if(!demoMode&&parts.length&&$('voice').value!=='demo')choose(+$('voice').value)};
$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(!/\.(mid|midi)$/i.test(f.name))throw Error('El archivo debe terminar en .mid o .midi');let d=new DataView(await f.arrayBuffer());if(d.getUint32(0)!==0x4d546864)throw Error('No es un MIDI válido');let hl=d.getUint32(4),tracks=d.getUint16(10);division=d.getUint16(12);if(division&32768)throw Error('Temporización SMPTE no compatible');let off=8+hl,map=new Map(),names=[],ts=[{tick:0,tempo:500000}];for(let tr=0;tr<tracks;tr++){if(d.getUint32(off)!==0x4d54726b)throw Error('Pista dañada');let len=d.getUint32(off+4),p={i:off+8},end=p.i+len,t=0,run=0,name='',active={};while(p.i<end){t+=rv(d,p);let st=d.getUint8(p.i++);if(st<128){p.i--;st=run}else if(st<240)run=st;if(st===255){let ty=d.getUint8(p.i++),l=rv(d,p);if(ty===81&&l===3)ts.push({tick:t,tempo:d.getUint8(p.i)<<16|d.getUint8(p.i+1)<<8|d.getUint8(p.i+2)});if(ty===3){name='';for(let q=0;q<l;q++)name+=String.fromCharCode(d.getUint8(p.i+q))}p.i+=l;continue}if(st===240||st===247){p.i+=rv(d,p);continue}let cmd=st&240,ch=st&15,n=d.getUint8(p.i++),v=(cmd===192||cmd===208)?0:d.getUint8(p.i++),key=tr+':'+ch;if(!map.has(key))map.set(key,{tr,ch,n:[]});let ak=ch+':'+n;if(cmd===144&&v)(active[ak]??=[]).push(t);else if(cmd===128||(cmd===144&&!v)){let q=active[ak]?.shift();if(q!=null)map.get(key).n.push({p:n,s:q,e:Math.max(t,q+1)})}}names[tr]=name;off=end}tempos=ts.sort((a,b)=>a.tick-b.tick);parts=[...map.values()].filter(p=>p.n.length).map(p=>({...p,name:names[p.tr]}));if(!parts.length)throw Error('No se encontraron notas');all=[];parts.forEach((p,part)=>p.n.forEach(n=>all.push({...n,part,ch:p.ch})));let melodic=parts.map((p,i)=>({p,i})).filter(x=>x.p.ch!==9);if(!melodic.length)throw Error('El MIDI solo contiene percusión y no ofrece una voz para el xilófono');let bi=melodic.map(x=>({i:x.i,c:x.p.n.filter(n=>MN.includes(n.p+bestShift(x.p.n))).length})).sort((a,b)=>b.c-a.c)[0].i;fillVoiceSelector(String(bi));demoMode=false;choose(bi,false);let drums=parts.filter(p=>p.ch===9).length;$('msg').className='msg ok';$('msg').textContent=`${f.name}: ${melodic.length} voces melódicas seleccionables${drums?` y ${drums} pista${drums>1?'s':''} de percusión como acompañamiento`:''}. La percusión no aparece en el selector.`}catch(x){$('msg').className='msg bad';$('msg').textContent=x.message}finally{e.target.value=''}};build()})();</script></body></html>
